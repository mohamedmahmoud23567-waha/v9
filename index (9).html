async function parse(file){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,PG={};let it=[];

const nk=t=>norm(String(t||'').normalize('NFKC').replace(/[\u064B-\u065F\u0640]/g,'')).replace(/[^\u0600-\u06FFa-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const rv=w=>[...w].reverse().join(''),variants=t=>{const w=t.split(/\s+/);return[t,[...w].reverse().join(' '),w.map(rv).join(' '),w.map(rv).reverse().join(' ')]};
const bg=x=>{x=x.replace(/ /g,'');const o=[];for(let i=0;i<x.length-1;i++)o.push(x.slice(i,i+2));return o};
const dice=(a,b)=>{const A=bg(a),B=bg(b);if(!A.length||!B.length)return 0;const m={};B.forEach(x=>m[x]=(m[x]||0)+1);let i=0;A.forEach(x=>{if(m[x]>0){i++;m[x]--}});return 2*i/(A.length+B.length)};
const sc=(a,b)=>{const A=new Set(a.split(' ').filter(Boolean)),B=new Set(b.split(' ').filter(Boolean));let i=0;A.forEach(w=>{if(B.has(w))i++});return Math.max(A.size&&B.size?i/Math.max(A.size,B.size):0,dice(a,b))};
const regCenters=()=>{const m={};profiles.filter(p=>p.approved&&p.role!=='admin').forEach(p=>m[p.center_norm]=p.center_name);techs.forEach(t=>{if(!m[t.center_norm])m[t.center_norm]=t.center_name});return Object.entries(m)};
function resolve(d){const raw=(d.center_name||'').trim();if(!raw){d._m='⚠ مفيش «القائم بالعمل» في الأمر — اختار المركز يدوي';return}
 const V=variants(raw).map(nk),sco=q=>Math.max(...V.map(z=>sc(z,nk(q)))),pct=x=>Math.round(x*100)+'%',
 C=[...regCenters().map(([n,c])=>({k:'c',n:c,c,s:sco(c)})),...techs.map(t=>({k:'t',n:t.name,c:t.center_name,s:sco(t.name)}))].sort((p,q)=>q.s-p.s),a=C[0],b=C[1]||{s:0};
 if(a&&a.s>=.75&&a.s-b.s>=.05){d.center_name=a.c;if(a.k==='t'){d.tech_name=a.n;d._m=`👷 «${raw}» ← الفني «${a.n}» (${pct(a.s)}) ← مركز «${a.c}»`}else d._m=`🏢 «${raw}» ← المركز «${a.c}» (${pct(a.s)})`}
 else d._m=`⚠ «${raw}» غير مؤكد — الأقرب: ${C.slice(0,3).map(x=>(x.k==='t'?'👷 ':'🏢 ')+x.n+' ('+pct(x.s)+')').join('، ')||'—'} — اختار يدوي`}

<p><input id="ae" type="email" placeholder="إيميل الأدمن الجديد"> <input id="ap" placeholder="الباسورد (6 حروف على الأقل)"> <button class="p" onclick="addAdmin()">إضافة أدمن</button> <span id="am" class="red"></span></p></div>`;

 let id=x.data&&x.data.user&&x.data.user.id;

 const ch=(a,n)=>Array.from({length:Math.ceil(a.length/n)},(_,i)=>a.slice(i*n,i*n+n)),ids=L.map(o=>o.id),sw={};L.forEach(o=>sw[o.id]=o.swo);const LG=[],paths=[];

 for(const bk of ['pdfs','photos']){const P=paths.filter(x=>x[0]===bk).map(x=>x[1]);for(const c of ch(P,50)){const{error}=await sb.storage.from(bk).remove(c);if(error)return alert('فشل مسح الملفات: '+error.message+'\nما اتمسحش أي بلاغ.')}}
 for(const c of ch(ids,50)){const{error}=await sb.from('orders').delete().in('id',c);if(error)return alert('فشل مسح البلاغات: '+error.message)}
 await load();WARN='';go('list');alert('✅ اتمسح '+L.length+' بلاغ مغلق')}
